<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🍽️ ランチルーレット</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="app">
      <h1 class="app-title">🍽️ ランチルーレット</h1>

      <main class="card">
        <section class="candidates-panel">
          <h2 class="panel-title">ランチ候補</h2>

          <form id="add-form" class="add-form">
            <input
              id="add-input"
              class="add-input"
              type="text"
              placeholder="候補を追加 (例: 🍕 ピザ)"
              maxlength="20"
              autocomplete="off"
            />
            <button type="submit" class="add-button">追加</button>
          </form>

          <ul id="candidate-list" class="candidate-list"></ul>
        </section>

        <section class="roulette-panel">
          <div class="wheel-wrapper">
            <div class="pointer" aria-hidden="true"></div>
            <div id="wheel" class="wheel"></div>
            <button id="spin-button" class="spin-button" type="button">
              SPIN!
            </button>
          </div>

          <div id="result" class="result" aria-live="polite"></div>
        </section>
      </main>
    </div>

    <script src="js/roulette-logic.js"></script>
    <script src="js/main.js"></script>
  </body>
</html>
